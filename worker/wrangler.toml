# ============================================================
# JEJAK 7 KAIH - Backend Cloudflare Worker
# ------------------------------------------------------------
# CARA PAKAI (cukup beberapa perintah, sekali saja):
#
#   1. npm install
#   2. npx wrangler login          <- membuka browser, masuk ke akun Cloudflare
#   3. npx wrangler d1 create jejak7
#      salin database_id yang muncul ke bawah, lalu jalankan:
#      npx wrangler d1 execute jejak7 --local  --file=migrations/0001_init.sql
#      npx wrangler d1 execute jejak7 --remote --file=migrations/0001_init.sql
#   4. npx wrangler deploy
#
# Lalu salin URL https://jejak7-api.<namamu>.workers.dev ke
# assets/js/site-config.js baris scriptUrl.
# Untuk mengembalikan ke Apps Script, ubah baris itu saja.
#
# CATATAN: komentar di berkas ini WAJIB pakai "#".
# Parser TOML wrangler tidak mengenali "//" sebagai komentar, dan
# akan menolak berkas dengan pesan "illegal character in key".
# ============================================================

name = "jejak7-api"
main = "src/index.js"
compatibility_date = "2026-10-01"

# JANGAN menulis blok [limits] di sini. Paket gratis Cloudflare
# menolak penyetelan batas CPU dengan pesan:
#   "CPU limits are not supported for the Free plan" [code: 100328]
# Paket gratis sudah memberi kuota CPU sendiri (cukup untuk pekerjaan
# kita, karena semua yang berat adalah operasi baca dari D1, bukan
# perhitungan). Menambah blok [limits] hanya membuat deploy gagal.
# Kalau nanti Tuan naik ke paket berbayar, baru boleh menambahnya.

# database_id diisi oleh "npx wrangler d1 create jejak7".
[[d1_databases]]
binding = "DB"
database_name = "jejak7"
database_id = "7633908b-cdf2-4426-ac20-2ad541320aec"
migrations_dir = "migrations"

# Variabel lingkungan. TIDAK pernah menaruh rahasia di sini -
# berkas ini ikut ter-deploy ke GitHub Pages.
[vars]
ZONA_WAKTU = "Asia/Makassar"

# Catatan: tidak ada [triggers] cron. Semua sinkron berasal dari
# perangkat yang sedang dipakai, jadi tidak ada trafik sia-sia
# saat sekolah tutup. Ini yang membuat kuota jauh lebih lega
# dibanding model lama yang menyalakan timer terus.
#
# TIDAK ADA [observability] dan tidak ada Workers KV: baca-tulis
# cukup dari D1 saja, menambah service hanya menambah tempat salah.